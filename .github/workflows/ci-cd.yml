name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  test:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis
        run: npm run lint

      - name: Pruebas automatizadas
        run: npm test

      - name: Build del frontend
        run: npm run build

  deploy:
    name: Desplegar en Render
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en Render
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
            echo "Deploy solicitado via deploy hook"
            exit 0
          fi

          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Sin credenciales de Render; se omite el deploy"
            exit 0
          fi

          KEY=$(printf '%s' "$RENDER_API_KEY" | tr -d '[:space:]"'\''' )
          KEY=${KEY#Bearer}
          KEY=${KEY#bearer}
          SID=$(printf '%s' "$RENDER_SERVICE_ID" | tr -d '[:space:]"'\''')

          CODE=$(curl -sS -o /tmp/render-deploy.json -w '%{http_code}' \
            -X POST "https://api.render.com/v1/services/$SID/deploys" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}') || CODE="000"

          echo "Render HTTP $CODE"
          cat /tmp/render-deploy.json || true
          {
            echo "### Deploy en Render"
            echo "- HTTP: \`$CODE\`"
            echo '```json'
            cat /tmp/render-deploy.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$CODE" ] && [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
            STATE="success"
          else
            STATE="failure"
          fi

          DETAIL=$(head -c 100 /tmp/render-deploy.json 2>/dev/null | tr '\n' ' ' | tr -d '"')
          jq -n --arg state "$STATE" --arg desc "HTTP $CODE $DETAIL" \
            '{state:$state, context:"render-deploy", description:($desc[0:135])}' > /tmp/status.json
          curl -s -o /dev/null -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data @/tmp/status.json || true

          if [ "$STATE" = "success" ]; then
            echo "Deploy solicitado via Render API"
          else
            echo "Render rechazo el deploy (HTTP $CODE)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

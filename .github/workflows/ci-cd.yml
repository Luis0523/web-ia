name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis
        run: npm run lint

      - name: Pruebas automatizadas
        run: npm test

      - name: Build del frontend
        run: npm run build

  deploy:
    name: Desplegar en Render
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en Render
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
            echo "Deploy solicitado via deploy hook"
            exit 0
          fi

          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Sin credenciales de Render; se omite el deploy"
            exit 0
          fi

          KEY=$(printf '%s' "$RENDER_API_KEY" | tr -d '[:space:]')
          SID=$(printf '%s' "$RENDER_SERVICE_ID" | tr -d '[:space:]')

          CODE=$(curl -sS -o /tmp/render-deploy.json -w '%{http_code}' \
            -X POST "https://api.render.com/v1/services/$SID/deploys" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')

          echo "Render HTTP $CODE"
          cat /tmp/render-deploy.json || true
          {
            echo "### Deploy en Render"
            echo "- HTTP: \`$CODE\`"
            echo '```json'
            cat /tmp/render-deploy.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
            echo "Deploy solicitado via Render API"
          else
            echo "Render rechazo el deploy"
            exit 1
          fi
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
